name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository. Set explicitly so it
# stays read-only even if the repo or org default token permission is widened.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          # Keep the job's GITHUB_TOKEN out of .git/config, where any build
          # script or transitive dependency could read it.
          persist-credentials: false

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔎 Typecheck
        run: bun run typecheck

      - name: 💅 Format check
        run: bun run format:check

      - name: 🧹 Lint
        run: bun run lint

      - name: 🧪 Test
        run: bun run test

      - name: 🏗️ Build (web)
        run: bun run build:web
