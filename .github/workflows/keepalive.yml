name: 💓 Keepalive

# Supabase pauses a free-tier project after roughly a week without external API
# traffic, which takes production and the e2e suite down with it. Nothing else in
# this repo touches the project on a timer — CI only runs on push and PR, and e2e
# runs against a static bundle — so this workflow is the only thing keeping the
# project awake across a quiet week.
on:
  schedule:
    # Daily, deliberately off the hour: GitHub delays crons scheduled on popular
    # round times, and a keepalive that drifts is worse than one that runs at :17.
    - cron: "17 7 * * *"
  # So the project can be woken by hand without waiting for the next cron.
  workflow_dispatch:

# Least privilege: this workflow never reads the repository at all.
permissions: {}

jobs:
  # A read the app itself performs on launch (see `fetchCatalog` in
  # src/data/catalog.ts), reduced to one row. Real traffic against a real table is
  # what Supabase counts as activity, so this doubles as a health check: a paused
  # project, a revoked key, or an RLS policy that stopped granting anon `select`
  # all turn the run red.
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🔔 Ping Supabase
        # Both values already ship in the client bundle (src/api/supabase.ts), so
        # there is nothing here that belongs in a secret.
        env:
          SUPABASE_URL: https://obtgldkascmxbtpnvscn.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_4z9kuzXtE3PeVgbPDtQUWw_cSrKxsu-
        run: |
          set -euo pipefail

          body="$(mktemp)"

          # `--retry` covers transient 5xx and connection failures only; a paused
          # project fails the same way every attempt, so retries cannot mask it.
          status="$(
            curl \
              --silent \
              --show-error \
              --max-time 30 \
              --retry 2 \
              --retry-delay 5 \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
              --output "${body}" \
              --write-out '%{http_code}' \
              "${SUPABASE_URL}/rest/v1/series?select=id&limit=1"
          )"

          if [ "${status}" != "200" ]; then
            echo "::error::Supabase returned HTTP ${status}"
            cat "${body}"
            exit 1
          fi

          # A 200 carrying an empty array means the request reached PostgREST but
          # read nothing — an RLS or seeding problem, not a live catalog.
          if ! jq --exit-status 'type == "array" and length > 0' "${body}" > /dev/null; then
            echo "::error::Supabase returned HTTP 200 with no catalog rows"
            cat "${body}"
            exit 1
          fi

          echo "✅ Supabase is awake and serving the catalog."
