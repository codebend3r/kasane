name: 🧪 Pull Request Checks

on:
  pull_request:
  push:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository. Set explicitly so it
# stays read-only even if the repo or org default token permission is widened.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned once. `bun run system-check` runs the same scripts locally against
# whatever bun the machine has, so this is the only place CI's version is fixed.
env:
  BUN_VERSION: 1.3.14

jobs:
  # The `system-check` script minus `build:web`, which `build` owns so that the
  # e2e chain does not queue behind linting.
  checks:
    name: 🚦 Pull request checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          # Keep the job's GITHUB_TOKEN out of .git/config, where any build
          # script or transitive dependency could read it.
          persist-credentials: false

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔎 Typecheck
        run: bun run typecheck

      - name: 💅 Format check
        run: bun run format:check

      - name: 🧹 Lint
        run: bun run lint

      - name: 🧪 Test
        run: bun run test

  # Runs alongside `checks` rather than after it: the e2e suite depends on the
  # bundle, not on the linters, and gating it behind them only delays the slowest
  # job in the workflow.
  build:
    name: 🚦 Pull request checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build (web)
        run: bun run build:web

      # Hand the built bundle to the e2e job rather than rebuilding it there.
      - name: 📤 Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # Kept out of `system-check` (and out of `bun run system-check`, the pre-commit
  # and pre-push hook) because a chromium download per commit is too slow. Runs
  # against the real `dist/` the build job already produced, so it covers the
  # bundle that ships, including the SPA fallback and the MangaDex proxy.
  e2e:
    name: 🚦 Pull request checks
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 📥 Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      # `--with-deps` adds the system libraries chromium needs on a bare runner;
      # `bun run e2e:install` omits them because a local machine already has them.
      - name: 🌐 Install chromium
        run: bunx playwright install --with-deps chromium

      - name: 🎭 E2E
        run: bun run e2e

      - name: 📊 Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
