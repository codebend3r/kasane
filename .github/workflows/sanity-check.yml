name: ✅ Sanity check

on:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  sanity-check:
    name: 🩺 Sanity check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🚦 Full check
        run: bun run system-check

      - name: 🎉 All clear
        run: echo "✅ ${GITHUB_SHA:0:7} landed on \`main\` clean — typecheck, format, lint, tests, and web build all green." >> "$GITHUB_STEP_SUMMARY"

      - name: 🚨 Something broke
        if: failure()
        run: echo "💥 ${GITHUB_SHA:0:7} broke \`main\` — check the failed step above." >> "$GITHUB_STEP_SUMMARY"
