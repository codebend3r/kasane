[test]
preload = ["./test/setup.ts"]
coverage = true
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["test/**"]

# Enforced per file, not across the run: a single module below the bar fails
# `bun test`, even when the overall percentage is far higher. Only files a test
# actually imports are measured.
#
# So the bar is set by the weakest file, not the average — today that is
# `src/api/mangadex.ts` (53% lines / 74% funcs), whose network paths in
# `getMangaDexInfoByAniListId` are covered only through their parsers. Parked
# just under it so any regression trips the suite, rather than at a round
# number no existing file could fail. Raise both once that export is covered.
[test.coverageThreshold]
lines = 0.5
functions = 0.7

[install]
# Every dependency is pinned to an exact version in package.json; this keeps
# `bun add` from reintroducing a `^` range the next time one is added.
exact = true
